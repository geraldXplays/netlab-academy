<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03060d" />
    <meta name="description" content="NetLab Academy — Build. Connect. Configure. Master. An immersive networking and IT infrastructure training platform." />
    <title>NetLab Academy</title>
    <script>
      // Apply saved theme / language before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('netlab:settings') || '{}').state || {};
        if (s.theme) document.documentElement.dataset.theme = s.theme;
        if (s.lang) document.documentElement.lang = s.lang;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
