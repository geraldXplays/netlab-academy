<!doctype html>
<html lang="en" data-theme="dark" data-identity="netlab">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03060d" />
    <meta name="description" content="NetLab Academy — Build. Connect. Configure. Master. An immersive networking and IT infrastructure training platform." />
    <title>NetLab Academy</title>
    <script>
      // Apply the saved identity, theme and language before first paint (no flash).
      try {
        var s = JSON.parse(localStorage.getItem('netlab:settings') || '{}').state || {};
        if (s.lang) document.documentElement.lang = s.lang;
        var c = JSON.parse(localStorage.getItem('netlab:vars') || 'null');
        if (c && c.vars) {
          var r = document.documentElement;
          for (var k in c.vars) r.style.setProperty(k, c.vars[k]);
          r.dataset.theme = c.mode;
          r.dataset.identity = c.id;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
